# Produção (pedido do usuário, 2026-08-30) — diferente do docker-compose.yml
# de dev: sem bind mount do código-fonte, sem --reload, sem Vite dev server,
# e nada exposto além de localhost (o nginx/Traefik já existente no VPS é
# quem termina TLS e expõe pra internet — ver DEPLOY.md).
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Banco: o MySQL não é mais um serviço daqui — é o container
# `mysql-compartilhado` (pasta TaskHero/mysql-compartilhado), que atende o
# OPoint e o ads-ops no mesmo servidor. A API entra na rede externa
# "banco" pra alcançá-lo.
services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      # Nome, não bind mount — fotos/banners/logo enviados por upload
      # (app/services/uploads.py) precisam sobreviver a um rebuild da
      # imagem; sem isso, cada `--build` apagaria tudo que foi enviado.
      - uploads_data:/app/uploads
    environment:
      # Peças separadas, não uma DATABASE_URL montada crua (ver
      # backend/app/core/config.py — senha com caractere especial tipo "#"
      # quebra o parsing de uma URL inteira interpolada por string; foi
      # exatamente o que aconteceu no primeiro deploy).
      DB_HOST: mysql-compartilhado
      DB_PORT: "3306"
      DB_USER: point_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: point
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-OPoint <onboarding@resend.dev>}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TOTALPASS_PARTNER_API_KEY: ${TOTALPASS_PARTNER_API_KEY:-}
      TOTALPASS_BASE_URL: ${TOTALPASS_BASE_URL:-https://booking-api.staging.totalpass.com}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WELLHUB_AUTH_TOKEN: ${WELLHUB_AUTH_TOKEN:-}
      WELLHUB_WEBHOOK_SECRET: ${WELLHUB_WEBHOOK_SECRET:-}
      WELLHUB_BASE_URL: ${WELLHUB_BASE_URL:-https://apitesting.partners.gympass.com/access/v1}
    restart: always
    ports:
      # 127.0.0.1 só — o nginx/Traefik do host é quem fala com a internet
      # (ver DEPLOY.md pro server block/labels).
      - "127.0.0.1:8001:8000"
    networks:
      - default
      - banco

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Build arg, não env var de runtime — o Vite embute isso no JS
        # final na hora do build (ver frontend/Dockerfile.prod).
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    ports:
      - "127.0.0.1:8002:80"
    depends_on:
      - api

  # Site institucional (opoint.com.br / www.opoint.com.br) — pedido do
  # usuário, 2026-09-09: domínio raiz passa a ser o site, o app (antes em
  # opoint.com.br) muda pra app.opoint.com.br. Estático, sem depender de
  # nada — ver DEPLOY.md seção 4 pro roteamento no nginx do host.
  landing:
    build: ./landing
    restart: always
    ports:
      - "127.0.0.1:8003:80"

networks:
  banco:
    external: true

volumes:
  uploads_data:
