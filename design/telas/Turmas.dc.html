<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Turmas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1E7}
a{color:#0B2A3C}a:hover{color:#123F59}
</style>
</helmet>
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #0B2A3C; background: #F6F1E7; width: 100%; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 0 0 240px; background: #0B2A3C; color: #C9D6DD; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px 24px">
<span style="display: inline-flex; align-items: center; gap: 1px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 25px; letter-spacing: -0.03em; line-height: 1; color: #F6F1E7"><svg width="30" height="30" viewBox="0 0 48 48" role="img" aria-label="O" style="flex: 0 0 30px; display: block"><circle cx="22" cy="23" r="16.5" fill="none" stroke="#F6F1E7" stroke-width="7"></circle><circle cx="34" cy="34" r="10" fill="{{accent}}" stroke="#0B2A3C" stroke-width="3.5"></circle><path d="M27.2 30.6c3.4-1.9 7.9-.8 10 2.6 1.4 2.3 1.3 5.3-.1 7.3" fill="none" stroke="#F6F1E7" stroke-width="2.2" stroke-linecap="round"></path></svg><span>Point</span></span>
</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
<a href="{{n.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 20px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
<span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 700; background: {{accent}}; color: #0B2A3C; padding: 2px 8px; border-radius: 999px">{{n.badge}}</span>
</sc-if>
</a>
</sc-for>
<div style="margin-top: auto; padding: 16px 12px 0; border-top: 1px solid #23465A; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #0B2A3C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AS</span>
<div>
<div style="font-size: 14px; font-weight: 700; color: #F6F1E7">Arena Sol</div>
<div style="font-size: 12px">4 quadras</div>
</div>
</div>
</aside>

<main style="flex: 1 1 600px; padding: 32px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<div style="font-size: 14px; color: #4F6B7A">Cadastros</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -1px">Turmas</h1>
</div>
<button type="button" onClick="{{openForm}}" style="font-family: inherit; font-size: 15px; font-weight: 700; padding: 12px 20px; min-height: 44px; border-radius: 999px; border: none; background: #0B2A3C; color: #F6F1E7; cursor: pointer">+ Nova turma</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section style="flex: 2 1 560px; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-sizing: border-box">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" style="font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
<div style="overflow-x: auto">
<div style="min-width: 640px">
<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; font-size: 12px; font-weight: 700; color: #4F6B7A; text-transform: uppercase; letter-spacing: 1px; padding: 8px 4px">
<span>Turma</span><span>Dias e horário</span><span>Professor</span><span>Quadra</span><span>Vagas</span>
</div>
<sc-for list="{{rows}}" as="t" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: 12px; align-items: center; padding: 14px 4px; border-top: 1px solid #EDE6D8; font-size: 14px">
<div style="min-width: 0">
<div style="font-weight: 700; font-size: 15px">{{t.name}}</div>
<div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap">
<span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{t.lvlBg}}; color: {{t.lvlFg}}">{{t.level}}</span>
<sc-if value="{{t.trial}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: {{accent}}">Aceita experimental</span>
</sc-if>
</div>
</div>
<div>
<div style="font-weight: 700">{{t.days}}</div>
<div style="font-size: 13px; color: #4F6B7A">{{t.time}}</div>
</div>
<span>{{t.coach}}</span>
<span>{{t.court}}</span>
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #EDE6D8; overflow: hidden">
<div style="height: 8px; border-radius: 999px; width: {{t.pct}}; background: {{t.bar}}"></div>
</div>
<span style="font-size: 13px; font-weight: 700; width: 36px">{{t.count}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
<aside style="flex: 1 1 340px; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; border: 2px solid #0B2A3C">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Nova turma</h2>
<button type="button" onClick="{{closeForm}}" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #F6F1E7; color: #0B2A3C; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
</div>

<label for="t-nome" style="font-size: 14px; font-weight: 700; margin-bottom: -10px">Nome da turma</label>
<input id="t-nome" type="text" value="{{fName}}" onChange="{{setName}}" placeholder="Ex.: Beach tennis manhã" style="font-family: inherit; font-size: 16px; padding: 14px 16px; border-radius: 14px; border: 2px solid #D8CDB6; color: #0B2A3C; background: #FFFFFF">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t-mod" style="font-size: 14px; font-weight: 700">Modalidade</label>
<select id="t-mod" style="font-family: inherit; font-size: 15px; padding: 12px; border-radius: 14px; border: 2px solid #D8CDB6; color: #0B2A3C; background: #FFFFFF">
<option>Beach tennis</option><option>Vôlei de praia</option><option>Futevôlei</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t-prof" style="font-size: 14px; font-weight: 700">Professor</label>
<select id="t-prof" style="font-family: inherit; font-size: 15px; padding: 12px; border-radius: 14px; border: 2px solid #D8CDB6; color: #0B2A3C; background: #FFFFFF">
<option>Prof. Ana</option><option>Prof. Rafa</option><option>Prof. Bia</option><option>Prof. Léo</option>
</select>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">Nível</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{levelOpts}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" style="font-family: inherit; font-size: 13px; font-weight: 700; min-height: 44px; border-radius: 14px; border: 2px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">Dias da semana</span>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{dayOpts}}" as="d" hint-placeholder-count="7">
<button type="button" onClick="{{d.toggle}}" aria-label="{{d.full}}" style="font-family: inherit; font-size: 13px; font-weight: 700; min-height: 44px; border-radius: 12px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: #0B2A3C; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t-hora" style="font-size: 14px; font-weight: 700">Início</label>
<input id="t-hora" type="time" value="{{fTime}}" onChange="{{setTime}}" style="font-family: inherit; font-size: 15px; padding: 12px 10px; border-radius: 14px; border: 2px solid #D8CDB6; color: #0B2A3C; background: #FFFFFF; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t-dur" style="font-size: 14px; font-weight: 700">Duração</label>
<select id="t-dur" style="font-family: inherit; font-size: 15px; padding: 12px 10px; border-radius: 14px; border: 2px solid #D8CDB6; color: #0B2A3C; background: #FFFFFF; min-width: 0">
<option>60 min</option><option>90 min</option><option>120 min</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t-vagas" style="font-size: 14px; font-weight: 700">Vagas</label>
<input id="t-vagas" type="number" value="{{fCap}}" onChange="{{setCap}}" style="font-family: inherit; font-size: 15px; padding: 12px 10px; border-radius: 14px; border: 2px solid #D8CDB6; color: #0B2A3C; background: #FFFFFF; min-width: 0">
</div>
</div>

<sc-for list="{{toggles}}" as="g" hint-placeholder-count="2">
<button type="button" onClick="{{g.flip}}" style="font-family: inherit; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px; border-radius: 14px; border: 2px solid #EDE6D8; background: #FFFFFF; color: #0B2A3C; cursor: pointer; text-align: left">
<span>
<span style="display: block; font-size: 15px; font-weight: 700">{{g.label}}</span>
<span style="display: block; font-size: 12px; color: #4F6B7A">{{g.hint}}</span>
</span>
<span style="flex: 0 0 48px; height: 28px; border-radius: 999px; background: {{g.track}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{g.align}}">
<span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span>
</span>
</button>
</sc-for>

<sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 700; color: #A3401A">Informe o nome e escolha pelo menos um dia.</span>
</sc-if>
<button type="button" onClick="{{save}}" style="font-family: inherit; font-size: 16px; font-weight: 700; padding: 16px; border-radius: 999px; border: none; background: {{accent}}; color: #0B2A3C; cursor: pointer">Salvar turma</button>
</aside>
</sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4F04A","options":["#D4F04A","#FF8A3D","#5ED3C6","#FFD23F"]},"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#D4F04A';
    const st = this.state || {};
    const filter = st.filter || 'Todas';
    const lvlStyle = { 'Iniciante': ['#E2ECF0', '#0B2A3C'], 'Intermediário': ['#9DB4C0', '#0B2A3C'], 'Avançado': ['#0B2A3C', '#F6F1E7'] };
    const base = [
      { name: 'Beach tennis manhã', sport: 'Beach tennis', level: 'Iniciante', days: 'Seg · Qua · Sex', time: '07:00 · 60 min', coach: 'Prof. Ana', court: 'Quadra 1', n: 6, cap: 8, trial: true },
      { name: 'Vôlei de praia', sport: 'Vôlei de praia', level: 'Intermediário', days: 'Seg · Qua', time: '08:00 · 60 min', coach: 'Prof. Rafa', court: 'Quadra 2', n: 10, cap: 10, trial: false },
      { name: 'Beach tennis técnica', sport: 'Beach tennis', level: 'Intermediário', days: 'Ter · Qui', time: '09:00 · 60 min', coach: 'Prof. Ana', court: 'Quadra 1', n: 5, cap: 8, trial: true },
      { name: 'Futevôlei iniciante', sport: 'Futevôlei', level: 'Iniciante', days: 'Ter · Qui', time: '17:00 · 60 min', coach: 'Prof. Léo', court: 'Quadra 3', n: 4, cap: 8, trial: true },
      { name: 'Beach tennis avançado', sport: 'Beach tennis', level: 'Avançado', days: 'Seg a Qui', time: '18:30 · 90 min', coach: 'Prof. Bia', court: 'Quadra 4', n: 8, cap: 8, trial: false },
      { name: 'Vôlei misto', sport: 'Vôlei de praia', level: 'Intermediário', days: 'Ter · Qui', time: '19:30 · 60 min', coach: 'Prof. Rafa', court: 'Quadra 2', n: 9, cap: 12, trial: true }
    ];
    const all = base.concat(st.added || []);
    const rows = all.filter((t) => filter === 'Todas' || t.sport === filter).map((t) => {
      const p = Math.round((t.n / t.cap) * 100);
      const l = lvlStyle[t.level];
      return Object.assign({}, t, { pct: p + '%', count: t.n + '/' + t.cap, bar: p >= 100 ? '#0B2A3C' : (p >= 75 ? '#3F6E86' : '#9DB4C0'), lvlBg: l[0], lvlFg: l[1] });
    });
    const filters = ['Todas', 'Beach tennis', 'Vôlei de praia', 'Futevôlei'].map((f) => ({ label: f, bg: f === filter ? '#0B2A3C' : '#FFFFFF', fg: f === filter ? '#F6F1E7' : '#0B2A3C', border: f === filter ? '#0B2A3C' : '#D8CDB6', pick: () => this.setState({ filter: f }) }));

    const fLevel = st.fLevel || 'Iniciante';
    const fDays = st.fDays || [];
    const fTrial = st.fTrial !== false;
    const fWell = st.fWell !== false;
    const dayDefs = [['S', 'Segunda', 'Seg'], ['T', 'Terça', 'Ter'], ['Q', 'Quarta', 'Qua'], ['Q', 'Quinta', 'Qui'], ['S', 'Sexta', 'Sex'], ['S', 'Sábado', 'Sáb'], ['D', 'Domingo', 'Dom']];

    const navDefs = [
      ['Início', 'Dashboard.dc.html', 'M3 11l9-8 9 8M5 10v10h14V10'],
      ['Agenda', 'Agenda.dc.html', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],
      ['Check-ins', 'Checkins.dc.html', 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9', 2],
      ['Aulas experimentais', '#', 'M12 5v14M5 12h14', 4],
      ['Turmas', 'Turmas.dc.html', 'M4 6h16M4 12h16M4 18h10'],
      ['Quadras', 'Quadras.dc.html', 'M3 4h18v16H3zM12 4v16M3 12h18'],
      ['Alunos', 'Alunos.dc.html', 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75'],
      ['Professores', 'Professores.dc.html', 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
      ['Caixa', 'Caixa.dc.html', 'M3 7h18v13H3zM3 7l3-4h12l3 4M12 11v5M9.5 13.5h5'],
      ['Cobranças', 'Cobrancas.dc.html', 'M3 6h18v12H3zM3 10h18M7 15h3', 4],
      ['Relatórios', 'Relatorios.dc.html', 'M4 20V10M10 20V4M16 20v-7M22 20H2']
    ];
    const active = 'Turmas';
    const nav = navDefs.map((n) => ({ label: n[0], href: n[1], icon: n[2], hasBadge: !!n[3], badge: n[3] || '', bg: n[0] === active ? '#123F59' : 'transparent', fg: n[0] === active ? '#F6F1E7' : '#C9D6DD' }));

    return {
      accent: accent,
      nav: nav,
      filters: filters,
      rows: rows,
      showForm: st.showForm !== false,
      openForm: () => this.setState({ showForm: true }),
      closeForm: () => this.setState({ showForm: false, err: false }),
      fName: st.fName || '',
      setName: (e) => this.setState({ fName: e.target.value }),
      fTime: st.fTime || '07:00',
      setTime: (e) => this.setState({ fTime: e.target.value }),
      fCap: st.fCap || '8',
      setCap: (e) => this.setState({ fCap: e.target.value }),
      levelOpts: ['Iniciante', 'Intermediário', 'Avançado'].map((l) => ({ label: l, bg: l === fLevel ? '#0B2A3C' : '#FFFFFF', fg: l === fLevel ? '#F6F1E7' : '#0B2A3C', border: l === fLevel ? '#0B2A3C' : '#D8CDB6', pick: () => this.setState({ fLevel: l }) })),
      dayOpts: dayDefs.map((d, i) => {
        const on = fDays.indexOf(i) > -1;
        return { label: d[0], full: d[1], bg: on ? accent : '#FFFFFF', border: on ? '#0B2A3C' : '#D8CDB6',
          toggle: () => { const cur = (this.state || {}).fDays || []; this.setState({ fDays: on ? cur.filter((x) => x !== i) : cur.concat([i]).sort() }); } };
      }),
      toggles: [
        { label: 'Aceita aula experimental', hint: 'Aparece no agendamento do site', on: fTrial, flip: () => this.setState({ fTrial: !fTrial }) },
        { label: 'Aceita Wellhub', hint: 'Alunos podem fazer check-in pelo app', on: fWell, flip: () => this.setState({ fWell: !fWell }) }
      ].map((g) => Object.assign(g, { track: g.on ? '#0B2A3C' : '#D8CDB6', align: g.on ? 'flex-end' : 'flex-start' })),
      showError: !!st.err,
      save: () => {
        const name = (st.fName || '').trim();
        if (!name || !fDays.length) { this.setState({ err: true }); return; }
        const t = { name: name, sport: 'Beach tennis', level: fLevel, days: fDays.map((i) => dayDefs[i][2]).join(' · '), time: (st.fTime || '07:00') + ' · 60 min', coach: 'Prof. Ana', court: 'Quadra 1', n: 0, cap: parseInt(st.fCap || '8', 10) || 8, trial: fTrial };
        this.setState({ added: (st.added || []).concat([t]), fName: '', fDays: [], err: false, filter: 'Todas' });
      }
    };
  }
}
</script>
</body>
</html>
