# app.opoint.com.br — painel (point-web-1) + API (point-api-1).
# Carregado pelo proxy compartilhado do servidor (container
# proxy-compartilhado, pasta TaskHero/proxy-compartilhado), que monta esta
# pasta em /etc/nginx/sites/opoint.
# Depois de mudar este arquivo: git pull + docker exec proxy-compartilhado nginx -t && docker exec proxy-compartilhado nginx -s reload

server {
    listen 80;
    server_name app.opoint.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.opoint.com.br;

    ssl_certificate /etc/letsencrypt/live/app.opoint.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.opoint.com.br/privkey.pem;

    # DNS interno do Docker, consultado a cada requisição (via variável no
    # proxy_pass). Sem isso o nginx guarda o IP do container só no start e
    # dá 502 sempre que um deploy recria o container com IP novo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $point_api http://point-api-1:8000;
    set $point_web http://point-web-1:80;

    # A API aceita fotos de até 5 MB (app/services/uploads.py); o padrão
    # do nginx (1 MB) barrava antes de chegar nela.
    client_max_body_size 6m;

    # Compressão (pedido do usuário, 2026-10-02: "achando um pouquinho lento
    # as telas") — o JS do painel tem ~600 KB e as listas da API vêm em
    # JSON; comprimido, cai pra ~1/4. Vale pro painel e pra API.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

    location /api/ {
        # proxy_pass com variável não troca o prefixo sozinho: /api/x -> /x
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $point_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $point_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
