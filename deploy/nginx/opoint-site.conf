# opoint.com.br — site institucional (point-landing-1).
# Carregado pelo proxy compartilhado (ver opoint-app.conf).

server {
    listen 80;
    server_name opoint.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name opoint.com.br;

    ssl_certificate /etc/letsencrypt/live/opoint.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opoint.com.br/privkey.pem;

    # Resolve o container a cada requisição (ver opoint-app.conf).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $point_landing http://point-landing-1:80;

    location / {
        proxy_pass $point_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
