server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html —
    # o roteamento de verdade é feito pelo react-router-dom no cliente
    # (senão um F5 em /aluno/agenda, por exemplo, devolveria 404 do nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite já cuida disso no build) podem cachear
    # forte; o index.html em si não deve cachear, pra sempre pegar o
    # deploy mais recente.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
