<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3a53" />
    <!-- Deixa a barra de status "por baixo" do conteúdo no iOS, pra caber
         no visual de app quando adicionado à tela inicial (pedido do
         usuário, 2026-08-25) — funciona mesmo sem virar um PWA completo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OPoint</title>
    <!-- Aplica o modo escuro antes do CSS/React carregarem (pedido do
         usuário, 2026-09-01) — sem isso, a tela pisca clara por uma
         fração de segundo antes de escurecer. Espelha src/theme.ts
         (mesma chave de localStorage), mas precisa estar duplicado aqui
         porque roda antes de qualquer módulo JS ser importado. -->
    <script>
      (function () {
        try {
          var tema = localStorage.getItem("opoint-tema");
          if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
          else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
